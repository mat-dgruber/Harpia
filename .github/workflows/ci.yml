name: Integração Contínua (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-compiler:
    name: Test & Lint Harpia Compiler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Instalar Dependências
        run: |
          go mod download
          go mod tidy

      - name: Validar Formatação de Código (go fmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Código não formatado com gofmt. Execute 'go fmt ./...' localmente."
            gofmt -d .
            exit 1
          fi

      - name: Executar Análise Estática (go vet)
        run: go vet ./...

      - name: Executar Testes Unitários
        run: go test ./... -v

  seguranca:
    name: Vulnerabilidades (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # Falha o PR se houver vulnerabilidade ALCANÇÁVEL pelo código (stdlib ou dependências).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
